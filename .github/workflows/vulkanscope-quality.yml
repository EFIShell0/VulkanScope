name: VulkanScope Quality Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python tools/quality_gate.py --strict-upstream --fetch-locked-upstream

  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37 ndk;29.0.14206865 cmake;3.22.1'
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon clean lintRelease testReleaseUnitTest assembleRelease
